name: Validate app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kmegle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            benchmarks/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: benchmarks
      - run: npm test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kmegle_test
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-only-not-a-real-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: local-test.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: local-test
          NEXT_PUBLIC_FIREBASE_APP_ID: test-only
          BACKEND_URL: http://localhost:5000
      - run: npx playwright install --with-deps chromium
        working-directory: benchmarks
      - run: node benchmarks/ui-regression.cjs && node benchmarks/worker-regression.cjs
